<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5Easy Games</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 20% 20%, rgba(101, 211, 255, 0.35), transparent 32%),
        radial-gradient(circle at 80% 25%, rgba(255, 105, 180, 0.28), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(137, 255, 196, 0.2), transparent 36%),
        linear-gradient(135deg, #070b1f 0%, #111936 48%, #090d1d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      transform: rotate(10deg);
      mask-image: radial-gradient(circle, black 0%, transparent 70%);
    }

    main {
      position: relative;
      z-index: 1;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.08em;
      text-wrap: balance;
      background: linear-gradient(90deg, #ffffff 0%, #7ee7ff 34%, #a7ffcb 68%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 18px 42px rgba(77, 211, 255, 0.25));
    }

    .glow {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(520px, 70vw);
      aspect-ratio: 1;
      border-radius: 999px;
      background: rgba(101, 211, 255, 0.18);
      filter: blur(80px);
      transform: translate(-50%, -50%);
      z-index: -1;
    }
  </style>
</head>
<body>
  <main aria-label="5Easy Games">
    <div class="glow" aria-hidden="true"></div>
    <h1>5Easy Games</h1>
  </main>
</body>
</html>
